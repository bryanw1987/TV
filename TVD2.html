<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sports & Smart Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #000; color: white; overflow: hidden; height: 100dvh; width: 100vw; margin: 0; padding: 0; touch-action: none; }
        #root { height: 100%; width: 100%; }
        
        /* DASHBOARD ANIMATIONS */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .animate-blink { animation: blink 1s step-end infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        /* W1 SCOREBOARD STYLES */
        .w1-gold-glow { box-shadow: 0 0 15px rgba(234, 179, 8, 0.15); }
        @keyframes w1-colorPulse { 0% { text-shadow: none; transform: scale(1); } 50% { color: var(--pulse-color, #facc15); text-shadow: 0 0 25px var(--pulse-color, rgba(234, 179, 8, 0.8)); transform: scale(1.05); } 100% { text-shadow: none; transform: scale(1); } }
        .w1-score-pulse { animation: w1-colorPulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; display: inline-block; }
        @keyframes w1-fadeInOut { 0% { opacity: 0; transform: scale(0.95); } 15% { opacity: 1; transform: scale(1); } 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); } }
        .w1-animate-overlay-sequence { animation: w1-fadeInOut 3s ease-in-out forwards; }
        @keyframes w1-middle-out-horizontal { 0% { clip-path: inset(0 50% 0 50%); opacity: 0; } 15% { opacity: 1; } 70% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 0; } }
        @keyframes w1-marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .w1-animate-marquee { display: inline-block; white-space: nowrap; animation: w1-marquee 15s linear infinite; padding-left: 10%; }
        .w1-scoring-active { position: relative; overflow: hidden; z-index: 20; border-radius: 0.5rem; box-shadow: 0 0 40px var(--team-accent-dim, rgba(255,255,255,0.1)); }
        .w1-scoring-active::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, var(--team-accent) 0%, transparent 50%, var(--team-accent) 100%); animation: w1-middle-out-horizontal 1.5s ease-out infinite; z-index: -2; }
        .w1-scoring-active::after { content: ''; position: absolute; inset: 4px; background: var(--team-bg); border-radius: 0.3rem; z-index: -1; }
        .w1-drive-field { background-color: #1a472a; background-image: linear-gradient(0deg, transparent 45%, rgba(255,255,255,0.1) 50%, transparent 55%); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- HELPERS ---
        const usePersistedState = (key, defaultValue) => {
            const [state, setState] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    if (!item) return defaultValue;
                    return JSON.parse(item);
                } catch (error) { return defaultValue; }
            });
            useEffect(() => { try { window.localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }, [key, state]);
            return [state, setState];
        };

        const IconBase = ({ children, className, size = 24, ...props }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>);
        const Settings = (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Plus = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>;
        const Check = (props) => <IconBase {...props}><polyline points="20 6 9 17 4 12"/></IconBase>;
        const MapPin = (props) => <IconBase {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>;
        const CalendarIcon = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>;
        const CloudFilled = (props) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={props.className} {...props}><path d="M18.5 19H5.5C2.46 19 0 16.54 0 13.5C0 10.46 2.46 8 5.5 8C5.67 8 5.84 8.01 6 8.03C6.73 4.62 9.77 2 13.5 2C18.2 2 22 5.8 22 10.5C22 10.6 22 10.7 21.99 10.8C23.16 11.68 24 13 24 14.5C24 16.99 21.99 19 19.5 19H18.5Z"/></svg>);
        const Loader = (props) => <IconBase {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></IconBase>;

        // --- STANDARD CARDS (Clock & Weather) ---
        const ClockCard = ({ timezoneOffset, color = 'text-white' }) => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    if (timezoneOffset !== null && timezoneOffset !== undefined) {
                        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                        setTime(new Date(utc + (1000 * timezoneOffset)));
                    } else { setTime(now); }
                }, 1000);
                return () => clearInterval(timer);
            }, [timezoneOffset]);
            const formatTime = (date) => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }).replace(/ AM| PM/, '');
            const [hours, minutes] = formatTime(time).split(':');
            return (
                <div className="h-full w-full flex flex-col justify-center items-center p-[4vh] bg-[#0D0D0D] text-white relative overflow-hidden font-sans">
                    <div className="relative z-10 flex flex-col items-center justify-center h-full">
                        <div className={`text-[4vw] font-medium tracking-[0.2em] uppercase mb-[2vh] opacity-90 ${color}`}>{time.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })}</div>
                        <div className={`flex items-baseline gap-[1vh] leading-none select-none ${color}`}>
                            <span className="text-[35vw] font-bold tracking-tighter drop-shadow-2xl flex items-baseline leading-[0.8]">{hours}<span className="animate-blink">:</span>{minutes}</span>
                            <span className="text-[8vw] font-light uppercase opacity-80 self-end mb-[4vw]">{time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }).slice(-2)}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const WeatherCard = ({ weatherData }) => {
            if (!weatherData) return null;
            const { temp, condition, city, loading } = weatherData;
            if (loading) return <div className="h-full w-full flex items-center justify-center bg-blue-900 text-white"><Loader className="w-12 h-12 animate-spin" /></div>;
            return (
                <div className="h-full w-full relative overflow-hidden font-sans bg-gradient-to-br from-blue-600 to-cyan-500 text-white p-[2vmin]">
                    <div className="absolute top-[3vmin] left-[3vmin] flex items-center gap-[1vmin] opacity-80 z-20">
                        <MapPin className="w-[4vmin] h-[4vmin]" /><span className="text-[4vmin] font-bold uppercase tracking-wider">{city}</span>
                    </div>
                    <div className="flex h-full w-full items-center justify-center">
                        <h1 className="text-[40vmin] font-black leading-none tracking-tighter drop-shadow-lg">{Math.round(temp)}°</h1>
                    </div>
                </div>
            );
        };// --- PAHS / W1 SCOREBOARD COMPONENTS ---
        
        // 1. Setup Firebase Logic specifically for W1
        const firebaseConfig = { databaseURL: "https://pahsfootball-d35c2-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) { try { firebase.initializeApp(firebaseConfig); } catch (e) { console.error("Firebase Init Error:", e); } }

        // 2. W1 Sub-Components
        const W1FootballIcon = ({ className }) => (
            <svg viewBox="0 0 32 32" className={className} xmlns="http://www.w3.org/2000/svg" style={{ overflow: 'visible' }}>
                <g transform="rotate(-45 16 16)">
                    <ellipse cx="16" cy="16" rx="15" ry="10" fill="#8B4513" stroke="#FFFFFF" strokeWidth="1.5" />
                    <path d="M6 16H26" stroke="#FFFFFF" strokeWidth="1.5" strokeLinecap="round" />
                    <path d="M11 11V21" stroke="#FFFFFF" strokeWidth="1.5" strokeLinecap="round" />
                    <path d="M16 11V21" stroke="#FFFFFF" strokeWidth="1.5" strokeLinecap="round" />
                    <path d="M21 11V21" stroke="#FFFFFF" strokeWidth="1.5" strokeLinecap="round" />
                </g>
            </svg>
        );

        const W1LiveDrive = ({ game }) => {
            if (!game.ballOn || game.status === 'PREGAME' || game.status === 'FINAL' || game.status === 'HALF') return null;
            const yardInt = parseInt(game.ballOn) || 0;
            const isOpp = (game.ownOpp || "").toUpperCase() === "OPP";
            let percentage = yardInt === 50 ? 50 : (isOpp ? 100 - yardInt : yardInt);
            percentage = Math.max(0, Math.min(100, percentage));
            const isHomePossession = game.possession === 'home';
            const teamColor = isHomePossession ? (game.color2 || '#facc15') : (game.awayc2 || '#facc15');
            const homeColorBg = game.color1 || '#000000';
            const awayColorBg = game.awayc1 || '#000000';

            return (
                <div className="mt-[2vmin] mb-[1vmin] w-full max-w-[80vmin]">
                     <div className="relative w-full h-[8vmin] w1-drive-field rounded-md border-2 border-white/10 shadow-inner overflow-hidden flex">
                        <div className="relative h-full w-[10%] border-r border-white/30 flex items-center justify-center shrink-0 z-10" style={{ backgroundColor: homeColorBg }}>
                            <span className="text-[1.5vmin] font-black text-white/70">{game.home ? game.home.substring(0,3).toUpperCase() : 'HOM'}</span>
                        </div>
                        <div className="relative h-full flex-1">
                            {[10, 20, 30, 40, 50, 40, 30, 20, 10].map((yard, i) => (
                                <div key={i} className="absolute top-0 bottom-0 w-px flex flex-col items-center justify-center z-0" style={{ left: `${(i + 1) * 10}%`, transform: 'translateX(-50%)' }}>
                                    <div className="absolute top-0 bottom-0 w-px bg-white/30"></div>
                                    <span className="relative bg-[#1a472a] px-0.5 text-[1.5vmin] font-mono font-bold text-white/60 z-10">{yard}</span>
                                </div>
                            ))}
                            <div className="absolute top-0 bottom-0 z-10 transition-all duration-700 ease-out flex items-center"
                                 style={{ left: isHomePossession ? '0' : 'auto', right: isHomePossession ? 'auto' : '0', width: `${percentage}%`, background: `linear-gradient(${isHomePossession ? '90deg' : '-90deg'}, ${teamColor}44, ${teamColor})`, borderRight: isHomePossession ? `2px solid #fff` : 'none', borderLeft: !isHomePossession ? `2px solid #fff` : 'none' }}>
                                <div className={`absolute top-1/2 -translate-y-1/2 flex items-center ${isHomePossession ? 'flex-row' : 'flex-row-reverse'}`} style={{ [isHomePossession ? 'right' : 'left']: '-2vmin' }}>
                                    <W1FootballIcon className="w-[3vmin] h-[3vmin] drop-shadow-md relative z-10" />
                                </div>
                            </div>
                        </div>
                        <div className="relative h-full w-[10%] border-l border-white/30 flex items-center justify-center shrink-0 z-10" style={{ backgroundColor: awayColorBg }}>
                             <span className="text-[1.5vmin] font-black text-white/70">{game.away ? game.away.substring(0,3).toUpperCase() : 'AWY'}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const W1Card = ({ game }) => {
            const homeBg = game.color1 || 'transparent';
            const homeAccent = game.color2 || '#facc15'; 
            const awayBg = game.awayc1 || 'transparent'; 
            const awayAccent = game.awayc2 || '#facc15';
            const isLive = game.status !== 'FINAL' && game.status !== 'UPCOMING' && game.status !== 'PREGAME';

            return (
                <div className="h-full w-full bg-[#111] relative overflow-hidden flex flex-col items-center justify-center p-[4vmin]">
                    {/* Header */}
                    <div className="absolute top-0 left-0 w-full bg-neutral-900/80 border-b border-white/10 p-[2vmin] flex justify-between items-center z-20">
                        <div className="bg-yellow-500 text-black text-[2vmin] font-black uppercase px-[1.5vmin] py-[0.5vmin] rounded-sm">PAHS FOOTBALL</div>
                        {isLive && (
                            <div className="flex items-center gap-[2vmin] bg-white/10 px-[2vmin] rounded py-[0.5vmin]">
                                <span className="text-white font-mono text-[2.5vmin] font-bold">DOWN: {game.down}</span>
                                <span className="text-white font-mono text-[2.5vmin] font-bold">TO GO: {game.togo}</span>
                                <span className="text-white font-mono text-[2.5vmin] font-bold">BALL: {game.ownOpp} {game.ballOn}</span>
                            </div>
                        )}
                        <div className="text-white font-mono font-bold text-[3vmin] animate-pulse">{game.status === 'UPCOMING' ? game.clock : (game.status === 'FINAL' ? 'FINAL' : `${game.clock} - Q${game.quarter}`)}</div>
                    </div>

                    {/* Scoreboard Content */}
                    <div className="w-full max-w-5xl flex flex-col gap-[4vmin] relative z-10">
                        {game.ticker && (
                            <div className="bg-yellow-900/30 border border-yellow-500/50 rounded p-[1vmin] flex items-center overflow-hidden">
                                <div className="text-yellow-400 font-bold mr-[2vmin] text-[2vmin]">UPDATE:</div>
                                <div className="text-white text-[2vmin] font-mono uppercase tracking-widest w1-animate-marquee">{game.ticker}</div>
                            </div>
                        )}

                        {/* HOME TEAM */}
                        <div className="flex items-center justify-between p-[2vmin] rounded-xl relative overflow-hidden" style={{ backgroundColor: homeBg, border: game.possession === 'home' ? `2px solid ${homeAccent}` : '2px solid transparent' }}>
                            <div className="flex items-center gap-[3vmin] z-10 relative">
                                {game.homeLogo && <img src={game.homeLogo} className="w-[12vmin] h-[12vmin] object-contain bg-black rounded-full border-2 border-white/20" />}
                                <div>
                                    <div className="text-[6vmin] font-black text-white leading-none uppercase">{game.home}</div>
                                    <div className="text-[2.5vmin] font-bold text-white/70">{game.homeRecord}</div>
                                </div>
                            </div>
                            <div className="text-[12vmin] font-mono font-bold text-white z-10 relative">{game.homeScore}</div>
                        </div>

                        {/* AWAY TEAM */}
                        <div className="flex items-center justify-between p-[2vmin] rounded-xl relative overflow-hidden" style={{ backgroundColor: awayBg, border: game.possession === 'away' ? `2px solid ${awayAccent}` : '2px solid transparent' }}>
                            <div className="flex items-center gap-[3vmin] z-10 relative">
                                {game.awayLogo && <img src={game.awayLogo} className="w-[12vmin] h-[12vmin] object-contain bg-black rounded-full border-2 border-white/20" />}
                                <div>
                                    <div className="text-[6vmin] font-black text-white leading-none uppercase">{game.away}</div>
                                    <div className="text-[2.5vmin] font-bold text-white/70">{game.awayRecord}</div>
                                </div>
                            </div>
                            <div className="text-[12vmin] font-mono font-bold text-white z-10 relative">{game.awayScore}</div>
                        </div>

                        {/* Drive Chart */}
                        <div className="flex justify-center">
                            <W1LiveDrive game={game} />
                        </div>
                    </div>
                </div>
            );
        };

        // Data Fetcher Helper for App
        const usePahsData = (enabled) => {
            const [games, setGames] = useState([]);
            useEffect(() => {
                if (!enabled) return;
                const db = firebase.database();
                const rootRef = db.ref('games');
                const unsubscribe = rootRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const gamesArray = Array.isArray(data) ? data : Object.values(data);
                        // Process logic similar to original code to handle variations in keys
                        const processed = gamesArray.map((entry, i) => {
                            const findScore = (obj, type) => {
                                const key = Object.keys(obj).find(k => k.toLowerCase().includes(type) && k.toLowerCase().includes('score'));
                                return key ? obj[key] : (type==='home'?obj.homeScore:obj.awayScore) || 0;
                            };
                            return {
                                ...entry, id: entry.id || i,
                                home: entry.home||"Home", away: entry.away||"Away",
                                homeScore: findScore(entry, 'home'), awayScore: findScore(entry, 'away'),
                                status: (entry.status||"UPCOMING").toUpperCase(),
                                possession: (entry.possession||"").toLowerCase(),
                                ballOn: entry.ballon || entry.ballOn || "",
                                ownOpp: (entry.ownopp || entry.OwnOpp || "").toUpperCase(),
                                color1: entry.color1, color2: entry.color2, awayc1: entry.awayc1, awayc2: entry.awayc2,
                                homeLogo: entry.homeLogo, awayLogo: entry.awayLogo,
                                ticker: entry.message || entry.ticker || ""
                            };
                        });
                        setGames(processed);
                    }
                });
                return () => rootRef.off('value', unsubscribe);
            }, [enabled]);
            return games;
        };// --- MAIN APP ---
        const App = () => {
            const [zipConfigs, setZipConfigs] = usePersistedState('zipConfigs', [{ id: '10001', showForecast: false, days: 3 }]);
            const [weatherDataMap, setWeatherDataMap] = useState({});
            
            // PAHS Toggle State
            const [showPahs, setShowPahs] = usePersistedState('showPahsScoreboard', false);
            const pahsGames = usePahsData(showPahs);

            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [showControls, setShowControls] = useState(false);
            const controlsTimeoutRef = useRef(null);

            const handleInteraction = () => {
                setShowControls(true);
                if (controlsTimeoutRef.current) clearTimeout(controlsTimeoutRef.current);
                controlsTimeoutRef.current = setTimeout(() => { setShowControls(false); }, 5000);
            };
            useEffect(() => { handleInteraction(); }, []);

            // Weather Fetcher (Simplified for brevity)
            useEffect(() => {
                const fetchW = async (zip) => {
                    try {
                        const res = await fetch(`https://api.zippopotam.us/us/${zip}`);
                        const zData = await res.json();
                        const { latitude, longitude, "place name": city, state } = zData.places[0];
                        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`);
                        const wData = await wRes.json();
                        setWeatherDataMap(prev => ({...prev, [zip]: { temp: wData.current.temperature_2m, condition: wData.current.weather_code, city: `${city}, ${state}`, loading: false }}));
                    } catch(e) { console.error(e); }
                };
                zipConfigs.forEach(c => fetchW(c.id));
            }, [zipConfigs]);

            // Construct Slide Deck
            const allCards = useMemo(() => {
                const cards = [];
                
                // 1. W1 PAHS Scoreboard (Priority)
                if (showPahs && pahsGames.length > 0) {
                    pahsGames.forEach(game => {
                        // Only show active games or recent finals
                        if (game.status !== 'UPCOMING') {
                            cards.push({ id: `pahs-${game.id}`, component: <W1Card game={game} /> });
                        }
                    });
                }

                // 2. Standard Cards
                cards.push({ id: 'clock', component: <ClockCard /> });
                zipConfigs.forEach(c => {
                    if (weatherDataMap[c.id]) cards.push({ id: `weather-${c.id}`, component: <WeatherCard weatherData={weatherDataMap[c.id]} /> });
                });

                return cards;
            }, [zipConfigs, weatherDataMap, showPahs, pahsGames]);

            // Slideshow Logic
            useEffect(() => {
                if (allCards.length === 0) return;
                if (currentSlideIndex >= allCards.length) { setCurrentSlideIndex(0); return; }
                if (allCards.length <= 1 || isSettingsOpen) return;
                const interval = setInterval(() => { setCurrentSlideIndex(prev => (prev + 1) % allCards.length); }, 8000);
                return () => clearInterval(interval);
            }, [allCards.length, isSettingsOpen, currentSlideIndex]);

            return (
                <div className="w-full h-[100dvh] bg-black text-white overflow-hidden font-sans" onMouseMove={handleInteraction} onClick={handleInteraction}>
                    <div className="w-full h-full relative">
                        {allCards.map((card, index) => (
                            <div key={card.id} className={`absolute inset-0 w-full h-full transition-all duration-700 ease-in-out transform ${index === currentSlideIndex ? 'opacity-100 translate-x-0 z-10' : 'opacity-0 translate-x-8 z-0'}`}>
                                {card.component}
                            </div>
                        ))}
                    </div>

                    {/* Settings Button */}
                    <button onClick={() => setIsSettingsOpen(true)} className={`absolute top-4 right-4 z-50 p-3 bg-black/40 backdrop-blur-md rounded-full border border-white/10 ${showControls ? 'opacity-100' : 'opacity-0'}`}>
                        <Settings className="w-6 h-6 text-white" />
                    </button>

                    {/* Settings Modal */}
                    {isSettingsOpen && (
                        <div className="absolute inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 w-full max-w-lg rounded-2xl border border-slate-700 p-6 shadow-2xl">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold">Settings</h2>
                                    <button onClick={() => setIsSettingsOpen(false)}><X size={24} /></button>
                                </div>
                                <div className="space-y-6">
                                    {/* PAHS TOGGLE */}
                                    <div className="bg-yellow-900/20 border border-yellow-600/30 p-4 rounded-xl flex items-center justify-between">
                                        <div>
                                            <div className="font-bold text-yellow-500">PAHS Scoreboard</div>
                                            <div className="text-xs text-yellow-200/60">Show live high school scores</div>
                                        </div>
                                        <button onClick={() => setShowPahs(!showPahs)} className={`w-12 h-6 rounded-full relative transition-colors ${showPahs ? 'bg-yellow-500' : 'bg-slate-700'}`}>
                                            <div className={`absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform ${showPahs ? 'translate-x-6' : 'translate-x-0'}`} />
                                        </button>
                                    </div>

                                    {/* Zip Configs */}
                                    <div className="bg-slate-800 p-4 rounded-xl">
                                        <div className="font-bold mb-2">Weather ZIPs</div>
                                        <div className="flex gap-2 mb-2">
                                            {zipConfigs.map(z => (
                                                <div key={z.id} className="bg-slate-700 px-3 py-1 rounded-full text-sm flex items-center gap-2">
                                                    {z.id} <button onClick={() => setZipConfigs(zipConfigs.filter(x => x.id !== z.id))}><X size={12}/></button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <input id="zipInput" type="text" maxLength="5" placeholder="12345" className="bg-slate-950 border border-slate-600 rounded px-2 py-1 flex-1" />
                                            <button onClick={() => { const val = document.getElementById('zipInput').value; if(val.length===5) { setZipConfigs([...zipConfigs, {id:val, showForecast:false}]); document.getElementById('zipInput').value=''; }}} className="bg-blue-600 px-3 rounded"><Plus size={16}/></button>
                                        </div>
                                    </div>
                                    
                                    <button onClick={() => setIsSettingsOpen(false)} className="w-full bg-blue-600 py-3 rounded-xl font-bold">Done</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
