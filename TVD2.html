        #root { height: 100%; width: 100%; }
        
        /* DASHBOARD ANIMATIONS */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .animate-blink { animation: blink 1s step-end infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        /* W1 SCOREBOARD STYLES */
        .w1-gold-glow { box-shadow: 0 0 15px rgba(234, 179, 8, 0.15); }
        @keyframes w1-colorPulse { 0% { text-shadow: none; transform: scale(1); } 50% { color: var(--pulse-color, #facc15); text-shadow: 0 0 25px var(--pulse-color, rgba(234, 179, 8, 0.8)); transform: scale(1.05); } 100% { text-shadow: none; transform: scale(1); } }
        .w1-score-pulse { animation: w1-colorPulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; display: inline-block; }
        @keyframes w1-fadeInOut { 0% { opacity: 0; transform: scale(0.95); } 15% { opacity: 1; transform: scale(1); } 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); } }
        .w1-animate-overlay-sequence { animation: w1-fadeInOut 3s ease-in-out forwards; }
        @keyframes w1-middle-out-horizontal { 0% { clip-path: inset(0 50% 0 50%); opacity: 0; } 15% { opacity: 1; } 70% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 0; } }
        @keyframes w1-marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .w1-animate-marquee { display: inline-block; white-space: nowrap; animation: w1-marquee 15s linear infinite; padding-left: 10%; }
        .w1-scoring-active { position: relative; overflow: hidden; z-index: 20; border-radius: 0.5rem; box-shadow: 0 0 40px var(--team-accent-dim, rgba(255,255,255,0.1)); }
        .w1-scoring-active::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, var(--team-accent) 0%, transparent 50%, var(--team-accent) 100%); animation: w1-middle-out-horizontal 1.5s ease-out infinite; z-index: -2; }
        .w1-scoring-active::after { content: ''; position: absolute; inset: 4px; background: var(--team-bg); border-radius: 0.3rem; z-index: -1; }

                return () => clearInterval(timer);

            const formatTime = (date) => date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }).replace(/ AM| PM/, '');

                        <MapPin className="w-[4vmin] h-[4vmin]" /><span className="text-[4vmin] font-bold uppercase tracking-wider">{city}</span>
                    </div>
                    <div className="flex h-full w-full items-center justify-center">
                        <h1 className="text-[40vmin] font-black leading-none tracking-tighter drop-shadow-lg">{Math.round(temp)}°</h1>
                    </div>
                </div>
            );
        };
        // --- MAIN APP ---
        const TeamSelector = ({ title, teams, selected, onAdd, onRemove }) => (
            <div className="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
                <h3 className="font-bold text-white mb-2">{title}</h3>
                <div className="flex flex-wrap gap-2 mb-3">
                    {selected.map(id => (
                        <span key={id} className="bg-slate-700 text-white px-3 py-1 rounded-full text-sm flex items-center gap-2">
                            {teams.find(t=>t.id===id)?.city} {teams.find(t=>t.id===id)?.name} <button onClick={() => onRemove(id)}><X size={14} /></button>
                        </span>
                    ))}
                </div>
                <div className="flex gap-2">
                    <select id={`sel-${title}`} className="flex-1 bg-slate-950 border border-slate-600 rounded-lg px-3 py-2 text-white">
                        <option value="">Select Team</option>{teams.sort((a,b)=>a.city.localeCompare(b.city)).map(t => <option key={t.id} value={t.id}>{t.city} {t.name}</option>)}
                    </select>
                    <button onClick={() => { const val = document.getElementById(`sel-${title}`).value; if(val && !selected.includes(val)) onAdd(val); }} className="bg-blue-600 px-3 py-2 rounded-lg text-white"><Plus size={16} /></button>
                </div>
            </div>
        );

        const App = () => {
            const [nflTeamsSelected, setNflTeamsSelected] = usePersistedState('nflTeams', []);
            const [nhlTeamsSelected, setNhlTeamsSelected] = usePersistedState('nhlTeams', []);
            const [mlbTeamsSelected, setMlbTeamsSelected] = usePersistedState('mlbTeams', []);
            const [ncaafTeamsSelected, setNcaafTeamsSelected] = usePersistedState('ncaafTeams', []);
            
            const [nflData, setNflData] = useState({});
            const [nhlData, setNhlData] = useState({});
            const [mlbData, setMlbData] = useState({});
            const [ncaafData, setNcaafData] = useState({});

            const [zipConfigs, setZipConfigs] = usePersistedState('zipConfigs', [{ id: '10001', showForecast: false, days: 3 }]);
            const [weatherDataMap, setWeatherDataMap] = useState({});
            const [showPahs, setShowPahs] = usePersistedState('showPahsScoreboard', false);
            const [pahsGames, setPahsGames] = useState([]);

            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [showControls, setShowControls] = useState(false);
            const controlsTimeoutRef = useRef(null);

            const handleInteraction = () => {
                setShowControls(true);
                if (controlsTimeoutRef.current) clearTimeout(controlsTimeoutRef.current);
                controlsTimeoutRef.current = setTimeout(() => { setShowControls(false); }, 5000);
            };
            useEffect(() => { handleInteraction(); }, []);

            // --- DATA FETCHERS ---
            // 1. Weather
            useEffect(() => {
                const fetchW = async (zip) => {
                    try {
                        const res = await fetch(`https://api.zippopotam.us/us/${zip}`);
                        const zData = await res.json();
                        const { latitude, longitude, "place name": city, state } = zData.places[0];
                        const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`);
                        const wData = await wRes.json();
                        setWeatherDataMap(prev => ({...prev, [zip]: { temp: wData.current.temperature_2m, condition: wData.current.weather_code, city: `${city}, ${state}`, loading: false }}));
                    } catch(e) { console.error(e); }
                };
                zipConfigs.forEach(c => fetchW(c.id));
            }, [zipConfigs]);

            // 2. PAHS Firebase
            useEffect(() => {
                if (!showPahs) return;
                const db = firebase.database();
                const rootRef = db.ref('games');
                const unsubscribe = rootRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const gamesArray = Array.isArray(data) ? data : Object.values(data);
                        const processed = gamesArray.map((entry, i) => {
                            const findScore = (obj, type) => {
                                const key = Object.keys(obj).find(k => k.toLowerCase().includes(type) && k.toLowerCase().includes('score'));
                                return key ? obj[key] : (type==='home'?obj.homeScore:obj.awayScore) || 0;
                            };
                            return {
                                ...entry, id: entry.id || i,
                                home: entry.home||"Home", away: entry.away||"Away",
                                homeScore: findScore(entry, 'home'), awayScore: findScore(entry, 'away'),
                                status: (entry.status||"UPCOMING").toUpperCase(),
                                possession: (entry.possession||"").toLowerCase(),
                                ballOn: entry.ballon || entry.ballOn || "",
                                ownOpp: (entry.ownopp || entry.OwnOpp || "").toUpperCase(),
                                color1: entry.color1, color2: entry.color2, awayc1: entry.awayc1, awayc2: entry.awayc2,
                                homeLogo: entry.homeLogo, awayLogo: entry.awayLogo,
                                ticker: entry.message || entry.ticker || ""
                            };
                        });
                        setPahsGames(processed);
                    }
                });
                return () => rootRef.off('value', unsubscribe);
            }, [showPahs]);

            // 3. Sports API (Generic)
            const fetchSportData = async (sport, league, teamId) => {
                try {
                    const idStr = String(teamId).toLowerCase();
                    // Simplified fetch for brevity
                    const sbRes = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sport}/${league}/scoreboard`);
                    const sbData = await sbRes.json();
                    let liveGame = sbData.events?.find(e => e.competitions[0].competitors.some(c => String(c.team.id) === idStr) && e.status.type.state === 'in');
                    
                    if (liveGame) {
                        const comp = liveGame.competitions[0];
                        const myTeam = comp.competitors.find(c => String(c.team.id) === idStr);
                        const oppTeam = comp.competitors.find(c => c.id !== myTeam.id);
                        return { [teamId]: { status: 'LIVE', live: { 
                            score: { myScore: myTeam.score, oppScore: oppTeam.score }, 
                            opponent: oppTeam.team.abbreviation, 
                            opponentLogo: oppTeam.team.logo,
                            time: comp.status.displayClock, 
                            period: comp.status.period,
                            lastPlay: liveGame.competitions[0].situation?.lastPlay?.text || "Game in progress"
                        }}};
                    }
                    
                    const schedRes = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sport}/${league}/teams/${idStr}/schedule`);
                    const schedData = await schedRes.json();
                    const nextGame = schedData.events?.find(e => new Date(e.date) > new Date());
                    return { [teamId]: { status: 'OFFLINE', schedule: { next: { 
                        opponent: nextGame?.competitions[0].competitors.find(c => String(c.team.id) !== idStr)?.team?.abbreviation || 'TBD',
                        date: nextGame ? new Date(nextGame.date).toLocaleDateString() : '-',
                        time: nextGame ? new Date(nextGame.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '-'
                    }}}};
                } catch(e) { return { [teamId]: null }; }
            };

            useEffect(() => {
                const loadAll = () => {
                    nflTeamsSelected.forEach(id => fetchSportData('football', 'nfl', id).then(d => setNflData(prev => ({...prev, ...d}))));
                    nhlTeamsSelected.forEach(id => fetchSportData('hockey', 'nhl', id).then(d => setNhlData(prev => ({...prev, ...d}))));
                    mlbTeamsSelected.forEach(id => fetchSportData('baseball', 'mlb', id).then(d => setMlbData(prev => ({...prev, ...d}))));
                    ncaafTeamsSelected.forEach(id => fetchSportData('football', 'college-football', id).then(d => setNcaafData(prev => ({...prev, ...d}))));
                };
                loadAll();
                const interval = setInterval(loadAll, 60000);
                return () => clearInterval(interval);
            }, [nflTeamsSelected, nhlTeamsSelected, mlbTeamsSelected, ncaafTeamsSelected]);

            // --- RENDER SLIDES ---
            const allCards = useMemo(() => {
                const cards = [];
                // W1 Takeover Logic: If Live, put it first
                if (showPahs) pahsGames.forEach(g => { if(g.status !== 'UPCOMING') cards.push({ id: `pahs-${g.id}`, component: <W1Card game={g} /> }); });
                
                // Standard Clock & Weather
                cards.push({ id: 'clock', component: <ClockCard /> });
                zipConfigs.forEach(c => { if(weatherDataMap[c.id]) cards.push({ id: `weather-${c.id}`, component: <WeatherCard weatherData={weatherDataMap[c.id]} /> }); });

                // Sports Cards
                nflTeamsSelected.forEach(id => { if(nflData[id]) cards.push({ id: `nfl-${id}`, component: <NFLCard teamId={id} realData={nflData[id]} /> }); });
                nhlTeamsSelected.forEach(id => { if(nhlData[id]) cards.push({ id: `nhl-${id}`, component: <NHLCard teamId={id} realData={nhlData[id]} /> }); });
                mlbTeamsSelected.forEach(id => { if(mlbData[id]) cards.push({ id: `mlb-${id}`, component: <MLBCard teamId={id} realData={mlbData[id]} /> }); });
                ncaafTeamsSelected.forEach(id => { if(ncaafData[id]) cards.push({ id: `ncaaf-${id}`, component: <NCAAFCard teamId={id} realData={ncaafData[id]} /> }); });
                
                return cards;
            }, [nflTeamsSelected, nhlTeamsSelected, mlbTeamsSelected, ncaafTeamsSelected, nflData, nhlData, mlbData, ncaafData, zipConfigs, weatherDataMap, showPahs, pahsGames]);

            useEffect(() => {
                if (allCards.length === 0) return;
                if (currentSlideIndex >= allCards.length) { setCurrentSlideIndex(0); return; }
                if (allCards.length <= 1 || isSettingsOpen) return;
                const interval = setInterval(() => { setCurrentSlideIndex(prev => (prev + 1) % allCards.length); }, 8000);
                return () => clearInterval(interval);
            }, [allCards.length, isSettingsOpen, currentSlideIndex]);

            return (
                <div className="w-full h-[100dvh] bg-black text-white overflow-hidden font-sans" onMouseMove={handleInteraction} onClick={handleInteraction}>
                    <div className="w-full h-full relative">
                        {allCards.map((card, index) => (
                            <div key={card.id} className={`absolute inset-0 w-full h-full transition-all duration-700 ease-in-out transform ${index === currentSlideIndex ? 'opacity-100 translate-x-0 z-10' : 'opacity-0 translate-x-8 z-0'}`}>
                                {card.component}
                            </div>
                        ))}
                    </div>
                    <button onClick={() => setIsSettingsOpen(true)} className={`absolute top-4 right-4 z-50 p-3 bg-black/40 backdrop-blur-md rounded-full border border-white/10 ${showControls ? 'opacity-100' : 'opacity-0'}`}><Settings className="w-6 h-6 text-white" /></button>
                    
                    {isSettingsOpen && (
                        <div className="absolute inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 w-full max-w-lg rounded-2xl border border-slate-700 p-6 shadow-2xl flex flex-col h-[80vh]">
                                <div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-bold">Settings</h2><button onClick={() => setIsSettingsOpen(false)}><X size={24} /></button></div>
                                <div className="space-y-6 overflow-y-auto custom-scrollbar flex-1 pr-2">
                                    <div className="bg-yellow-900/20 border border-yellow-600/30 p-4 rounded-xl flex items-center justify-between">
                                        <div><div className="font-bold text-yellow-500">PAHS Scoreboard</div><div className="text-xs text-yellow-200/60">Toggle High School Feeds</div></div>
                                        <button onClick={() => setShowPahs(!showPahs)} className={`w-12 h-6 rounded-full relative transition-colors ${showPahs ? 'bg-yellow-500' : 'bg-slate-700'}`}><div className={`absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform ${showPahs ? 'translate-x-6' : 'translate-x-0'}`} /></button>
                                    </div>
                                    <div className="bg-slate-800 p-4 rounded-xl">
                                        <div className="font-bold mb-2">Weather ZIPs</div>
                                        <div className="flex gap-2 mb-2">{zipConfigs.map(z => (<div key={z.id} className="bg-slate-700 px-3 py-1 rounded-full text-sm flex items-center gap-2">{z.id} <button onClick={() => setZipConfigs(zipConfigs.filter(x => x.id !== z.id))}><X size={12}/></button></div>))}</div>
                                        <div className="flex gap-2"><input id="zipInput" type="text" maxLength="5" placeholder="12345" className="bg-slate-950 border border-slate-600 rounded px-2 py-1 flex-1" /><button onClick={() => { const val = document.getElementById('zipInput').value; if(val.length===5) { setZipConfigs([...zipConfigs, {id:val, showForecast:false}]); document.getElementById('zipInput').value=''; }}} className="bg-blue-600 px-3 rounded"><Plus size={16}/></button></div>
                                    </div>
                                    <TeamSelector title="NFL Teams" teams={NFL_TEAMS} selected={nflTeamsSelected} onAdd={(id) => setNflTeamsSelected([...nflTeamsSelected, id])} onRemove={(id) => setNflTeamsSelected(nflTeamsSelected.filter(t => t !== id))} />
                                    <TeamSelector title="NCAA Football" teams={NCAAF_TEAMS} selected={ncaafTeamsSelected} onAdd={(id) => setNcaafTeamsSelected([...ncaafTeamsSelected, id])} onRemove={(id) => setNcaafTeamsSelected(ncaafTeamsSelected.filter(t => t !== id))} />
                                    <TeamSelector title="NHL Teams" teams={NHL_TEAMS} selected={nhlTeamsSelected} onAdd={(id) => setNhlTeamsSelected([...nhlTeamsSelected, id])} onRemove={(id) => setNhlTeamsSelected(nhlTeamsSelected.filter(t => t !== id))} />
                                    <TeamSelector title="MLB Teams" teams={MLB_TEAMS} selected={mlbTeamsSelected} onAdd={(id) => setMlbTeamsSelected([...mlbTeamsSelected, id])} onRemove={(id) => setMlbTeamsSelected(mlbTeamsSelected.filter(t => t !== id))} />
                                </div>
                                <button onClick={() => setIsSettingsOpen(false)} className="w-full bg-blue-600 py-3 rounded-xl font-bold mt-4">Done</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
