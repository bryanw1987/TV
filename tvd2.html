<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sports & Smart Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script> 
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: white; 
            overflow: hidden; 
            height: 100dvh; 
            width: 100vw;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        #root {
            height: 100%;
            width: 100%;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .animate-blink { animation: blink 1s step-end infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        /* =========================================
           PAHS SCOREBOARD STYLES
           ========================================= */
        .w1-gold-glow { box-shadow: 0 0 15px rgba(234, 179, 8, 0.15); }

        @keyframes w1-colorPulse {
            0% { text-shadow: none; transform: scale(1); }
            50% { 
                color: var(--pulse-color, #facc15); 
                text-shadow: 0 0 25px var(--pulse-color, rgba(234, 179, 8, 0.8)); 
                transform: scale(1.05); 
            }
            100% { text-shadow: none; transform: scale(1); }
        }
        .w1-score-pulse {
            animation: w1-colorPulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            display: inline-block;
        }

        @keyframes w1-fadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            15% { opacity: 1; transform: scale(1); }
            85% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }
        .w1-animate-overlay-sequence {
            animation: w1-fadeInOut 3s ease-in-out forwards;
        }

        @keyframes w1-rotate-beam {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes w1-middle-out-horizontal {
            0% { clip-path: inset(0 50% 0 50%); opacity: 0; }
            15% { opacity: 1; }
            70% { clip-path: inset(0 0 0 0); opacity: 1; }
            100% { clip-path: inset(0 0 0 0); opacity: 0; }
        }

        @keyframes w1-endOverEnd {
            0% { opacity: 0; transform: translateY(-30px) rotateX(720deg) scale(0.5); }
            70% { transform: translateY(0) rotateX(0deg) scale(1.2); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
        }
        .w1-flip-in {
            animation: w1-endOverEnd 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            display: inline-block;
        }

        @keyframes w1-marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .w1-animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: w1-marquee 15s linear infinite;
            padding-left: 10%; 
        }

        .w1-scoring-active {
            position: relative;
            overflow: hidden;
            z-index: 20;
            border-radius: 0.5rem;
            box-shadow: 0 0 40px var(--team-accent-dim, rgba(255,255,255,0.1));
        }

        .w1-scoring-active::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, var(--team-accent) 0%, transparent 50%, var(--team-accent) 100%);
            animation: w1-middle-out-horizontal 1.5s ease-out infinite;
            z-index: -2;
        }

        .w1-scoring-active::after {
            content: ''; position: absolute; inset: 4px; background: var(--team-bg);
            border-radius: 0.3rem; z-index: -1;
        }

        .w1-pregame-card {
            position: relative; overflow: hidden; border-radius: 0.75rem; z-index: 0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            --card-bg: #171717; 
        }
        .w1-pregame-card::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, #ffffff, transparent 30%);
            transform: translate(-50%, -50%); animation: w1-rotate-beam 4s linear infinite; z-index: -2;
        }
        .w1-pregame-card::after {
            content: ''; position: absolute; inset: 3px; background: var(--card-bg); 
            border-radius: 0.6rem; z-index: -1;
        }

        .w1-live-card {
            position: relative; overflow: hidden; border-radius: 0.75rem; z-index: 0;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
            --card-bg: #171717; 
        }
        .w1-live-card::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, #dc2626, transparent 30%);
            transform: translate(-50%, -50%); animation: w1-rotate-beam 4s linear infinite; z-index: -2;
        }
        .w1-live-card::after {
            content: ''; position: absolute; inset: 3px; background: var(--card-bg); 
            border-radius: 0.6rem; z-index: -1;
        }

        @keyframes w1-particleExplosion {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--r)); opacity: 0; }
        }
        .w1-particle {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background-color: #facc15; border-radius: 50%; pointer-events: none; opacity: 0;
        }

        .w1-drive-field {
            background-color: #1a472a;
            background-image: linear-gradient(0deg, transparent 45%, rgba(255,255,255,0.1) 50%, transparent 55%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- FIREBASE INIT ---
        const firebaseConfig = {
            databaseURL: "https://pahsfootball-d35c2-default-rtdb.firebaseio.com/", 
        };
        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            try { firebase.initializeApp(firebaseConfig); } catch (e) { console.error("Firebase Init Error:", e); }
        }

        const usePersistedState = (key, defaultValue) => {
            const [state, setState] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    if (!item) return defaultValue;
                    const parsed = JSON.parse(item);
                    if (key === 'zipConfigs') {
                        if (Array.isArray(parsed) && parsed.length > 0 && typeof parsed[0] === 'string') {
                            return parsed.map(z => ({ id: z, showForecast: false, days: 3 }));
                        }
                        if (!Array.isArray(parsed)) return defaultValue;
                    }
                    return parsed;
                } catch (error) { return defaultValue; }
            });
            useEffect(() => {
                try { window.localStorage.setItem(key, JSON.stringify(state)); } catch (e) {}
            }, [key, state]);
            return [state, setState];
        };

        const IconBase = ({ children, className, style, size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style} {...props}>{children}</svg>
        );
        const Settings = (props) => <IconBase {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Plus = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>;
        const CalendarIcon = (props) => <IconBase {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>;
        const MapPin = (props) => <IconBase {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>;
        const Check = (props) => <IconBase {...props}><polyline points="20 6 9 17 4 12"/></IconBase>;
        const Sun = (props) => <IconBase {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></IconBase>;
        const CloudRain = (props) => <IconBase {...props}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></IconBase>;
        const CloudSnow = (props) => <IconBase {...props}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h.01"/><path d="M8 19h.01"/><path d="M12 17h.01"/><path d="M12 21h.01"/><path d="M16 15h.01"/><path d="M16 19h.01"/></IconBase>;
        const CloudLightning = (props) => <IconBase {...props}><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"/><path d="m13 12-3 5h4l-3 5"/></IconBase>;
        const Loader = (props) => <IconBase {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></IconBase>;
        const CloudFilled = (props) => (<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={props.className} style={props.style} {...props}><path d="M18.5 19H5.5C2.46 19 0 16.54 0 13.5C0 10.46 2.46 8 5.5 8C5.67 8 5.84 8.01 6 8.03C6.73 4.62 9.77 2 13.5 2C18.2 2 22 5.8 22 10.5C22 10.6 22 10.7 21.99 10.8C23.16 11.68 24 13 24 14.5C24 16.99 21.99 19 19.5 19H18.5Z"/></svg>);
        
        // PAHS Shared Icon Wrapper for Lucide
        const SharedIcon = ({ name, className, ...props }) => {
            const elementRef = useRef(null);
            useEffect(() => {
                if (window.lucide && elementRef.current) {
                    const pascalName = name.replace(/(^\w|-\w)/g, (m) => m.replace("-", "").toUpperCase());
                    const iconDef = window.lucide.icons ? window.lucide.icons[pascalName] : null;
                    if (iconDef) {
                        const svg = window.lucide.createElement(iconDef);
                        if (className) svg.setAttribute('class', className);
                        elementRef.current.innerHTML = '';
                        elementRef.current.appendChild(svg);
                    }
                }
            }, [name, className]);
            return <span ref={elementRef} style={{ display: 'inline-flex', verticalAlign: 'middle' }} {...props}></span>;
        };

        const Football = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" className={props.className} style={props.style} {...props}>
                <g transform="rotate(45 50 50)">
                    <ellipse cx="50" cy="50" rx="30" ry="48" fill="#8B4513" />
                    <path d="M30 18 Q 50 10 70 18 L 70 24 Q 50 16 30 24 Z" fill="white" />
                    <path d="M30 82 Q 50 90 70 82 L 70 76 Q 50 84 30 76 Z" fill="white" />
                    <path d="M48 35 L 48 65" stroke="white" strokeWidth="3" strokeLinecap="round" />
                    <path d="M42 40 L 54 40" stroke="white" strokeWidth="3" strokeLinecap="round" />
                    <path d="M42 45 L 54 45" stroke="white" strokeWidth="3" strokeLinecap="round" />
                    <path d="M42 50 L 54 50" stroke="white" strokeWidth="3" strokeLinecap="round" />
                    <path d="M42 55 L 54 55" stroke="white" strokeWidth="3" strokeLinecap="round" />
                    <path d="M42 60 L 54 60" stroke="white" strokeWidth="3" strokeLinecap="round" />
                </g>
            </svg>
        );

        const getWeatherIcon = (code, sizeClass, style = {}) => {
            if (code === undefined) return <Loader className={`animate-spin text-white ${sizeClass}`} style={style} />;
            const color = "text-gray-200";
            if (code === 0) return <Sun className={`${sizeClass} text-yellow-400 animate-pulse`} style={style} fill="currentColor" />;
            if (code <= 3) return <div className="relative" style={style}><Sun className={`${sizeClass} text-yellow-400`} fill="currentColor" /><div className={`absolute bottom-[-10%] right-[-10%] ${sizeClass} scale-75 text-gray-100`}><CloudFilled className="w-full h-full" /></div></div>;
            if (code <= 48) return <CloudFilled className={`${sizeClass} ${color}`} style={style} />;
            if (code <= 67) return <CloudRain className={`${sizeClass} text-blue-400`} style={style} fill="currentColor" />;
            if (code <= 77) return <CloudSnow className={`${sizeClass} text-white`} style={style} fill="currentColor" />;
            if (code >= 95) return <CloudLightning className={`${sizeClass} text-purple-400`} style={style} fill="currentColor" />;
            return <CloudFilled className={`${sizeClass} ${color}`} style={style} />;
        };

        const getOrdinal = (n) => { const s = ["th", "st", "nd", "rd"]; const v = n % 100; return s[(v - 20) % 10] || s[v] || s[0]; };

        const CLOCK_COLORS = [
            { label: 'White', value: 'text-white' }, { label: 'Red', value: 'text-red-500' },
            { label: 'Blue', value: 'text-blue-500' }, { label: 'Green', value: 'text-green-500' },
            { label: 'Yellow', value: 'text-yellow-400' }, { label: 'Purple', value: 'text-purple-500' },
            { label: 'Cyan', value: 'text-cyan-400' }, { label: 'Orange', value: 'text-orange-500' },
        ];
        // =========================================================================
        // PAHS COMPONENTS (Taken from Source)
        // =========================================================================

        const W1FootballIcon = ({ className }) => (
            <svg viewBox="0 0 32 32" className={className} xmlns="http://www.w3.org/2000/svg" style={{ overflow: 'visible' }}>
                <g transform="rotate(-45 16 16)">
                    <ellipse cx="16" cy="16" rx="15" ry="10" fill="#8B4513" stroke="#FFFFFF" strokeWidth="1.5" />
                    <path d="M6 16H26" stroke="#FFFFFF" strokeWidth="1.5" strokeLinecap="round" />
                    <path d="M11 11V21" stroke="#FFFFFF" strokeWidth="1.5" strokeLinecap="round" />
                    <path d="M16 11V21" stroke="#FFFFFF" strokeWidth="1.5" strokeLinecap="round" />
                    <path d="M21 11V21" stroke="#FFFFFF" strokeWidth="1.5" strokeLinecap="round" />
                </g>
            </svg>
        );

        const W1TeamLogo = ({ name, logoUrl, colorClass }) => {
            const [imgError, setImgError] = useState(false);
            useEffect(() => { setImgError(false); }, [logoUrl]);

            if (logoUrl && !imgError) {
                return (
                    <div className="w-12 h-12 rounded-full bg-black flex items-center justify-center overflow-hidden border-2 border-yellow-600/50 shadow-md relative z-10">
                        <img src={logoUrl} alt={name} className="w-full h-full object-contain p-0.5" onError={() => setImgError(true)} />
                    </div>
                );
            }
            return (
                <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg border-2 shadow-md relative z-10 ${colorClass}`}>
                    {name ? name.substring(0, 2).toUpperCase() : "??"}
                </div>
            );
        };

        const W1LiveDrive = ({ game }) => {
            if (!game.ballOn || game.status === 'PREGAME' || game.status === 'FINAL' || game.status === 'HALF' || game.status === 'UPCOMING') return null;
            const yardInt = parseInt(game.ballOn) || 0;
            const isOpp = (game.ownOpp || "").toUpperCase() === "OPP";
            let percentage = 0;
            if (yardInt === 50) { percentage = 50; } 
            else if (isOpp) { percentage = 100 - yardInt; } 
            else { percentage = yardInt; }
            percentage = Math.max(0, Math.min(100, percentage));

            const isHomePossession = game.possession === 'home';
            const teamColor = isHomePossession ? (game.color2 || '#facc15') : (game.awayc2 || '#facc15');
            const homeColorBg = game.color1 || '#000000';
            const awayColorBg = game.awayc1 || '#000000';
            const yardMarkers = [10, 20, 30, 40, 50, 40, 30, 20, 10];

            return (
                <div className="mt-6 mb-2">
                     <div className="flex justify-between items-end mb-1 px-1">
                        <span className="text-[10px] uppercase font-bold text-neutral-500 tracking-widest">Live Drive Tracker</span>
                        <div className="flex items-center gap-2">
                             <div className={`w-2 h-2 rounded-full ${isHomePossession ? 'animate-pulse' : ''}`} style={{backgroundColor: game.color2 || '#facc15'}}></div>
                             <span className="text-[9px] font-mono text-neutral-400">POSSESSION</span>
                             <div className={`w-2 h-2 rounded-full ${!isHomePossession ? 'animate-pulse' : ''}`} style={{backgroundColor: game.awayc2 || '#facc15'}}></div>
                        </div>
                     </div>
                    <div className="relative w-full h-20 w1-drive-field rounded-md border-2 border-white/10 shadow-inner overflow-hidden flex">
                        <div className="relative h-full w-[10%] border-r border-white/30 flex items-center justify-center shrink-0 z-10" style={{ backgroundColor: homeColorBg }}>
                            {game.homeLogo ? <img src={game.homeLogo} className="w-6 h-6 object-contain opacity-90" /> : <span className="text-[8px] font-black text-white/70">{game.home ? game.home.substring(0,3).toUpperCase() : 'HOM'}</span>}
                        </div>
                        <div className="relative h-full flex-1">
                            {yardMarkers.map((yard, i) => {
                                const leftPos = (i + 1) * 10;
                                return (
                                    <div key={i} className="absolute top-0 bottom-0 w-px flex flex-col items-center justify-center z-0" style={{ left: `${leftPos}%`, transform: 'translateX(-50%)' }}>
                                        <div className="absolute top-0 bottom-0 w-px bg-white/30"></div>
                                        <span className="relative bg-[#1a472a] px-0.5 text-[8px] font-mono font-bold text-white/60 z-10">{yard}</span>
                                    </div>
                                );
                            })}
                            <div className="absolute top-0 bottom-0 z-10 transition-all duration-700 ease-out flex items-center"
                                 style={{
                                    left: isHomePossession ? '0' : 'auto',
                                    right: isHomePossession ? 'auto' : '0',
                                    width: `${percentage}%`,
                                    background: `linear-gradient(${isHomePossession ? '90deg' : '-90deg'}, ${teamColor}44, ${teamColor})`,
                                    borderRight: isHomePossession ? `2px solid #fff` : 'none',
                                    borderLeft: !isHomePossession ? `2px solid #fff` : 'none'
                                 }}>
                                <div className={`absolute top-1/2 -translate-y-1/2 flex items-center ${isHomePossession ? 'flex-row' : 'flex-row-reverse'}`} style={{ [isHomePossession ? 'right' : 'left']: '-28px' }}>
                                    <W1FootballIcon className="w-5 h-5 drop-shadow-md relative z-10" />
                                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5 text-white drop-shadow-md -ml-1" style={{ transform: isHomePossession ? 'none' : 'rotate(180deg)' }}>
                                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                        <div className="relative h-full w-[10%] border-l border-white/30 flex items-center justify-center shrink-0 z-10" style={{ backgroundColor: awayColorBg }}>
                             {game.awayLogo ? <img src={game.awayLogo} className="w-6 h-6 object-contain opacity-90" /> : <span className="text-[8px] font-black text-white/70">{game.away ? game.away.substring(0,3).toUpperCase() : 'AWY'}</span>}
                        </div>
                    </div>
                </div>
            );
        };

        const W1StatusBadge = ({ status, clock, quarter }) => {
            const getQuarterDisplay = (q) => {
                if (!q) return "Q1";
                const qStr = String(q).toUpperCase();
                if (qStr === "OT" || qStr.includes("OVERTIME")) return "OT";
                const qNum = parseInt(q);
                if (!isNaN(qNum)) {
                    if (qNum > 4) { const otNum = qNum - 4; return otNum === 1 ? "OT" : `${otNum}OT`; }
                    return `Q${qNum}`;
                }
                return qStr;
            };
            if (status === "FINAL") return <span className="px-3 py-1 bg-neutral-800 text-neutral-400 text-xs font-bold rounded border border-neutral-700">FINAL</span>;
            if (status === "UPCOMING") return <span className="px-3 py-1 bg-neutral-800 text-yellow-500 text-xs font-bold rounded border border-yellow-900/30">{clock}</span>;
            if (status === "PREGAME") return (<div className="flex flex-col items-end animate-pulse"><span className="px-3 py-1 bg-green-600 text-white text-xs font-bold rounded mb-1 shadow-lg shadow-green-900/50 whitespace-nowrap">Game Starting Soon ...</span></div>);
            const isHalf = status === "HALF";
            return (
                <div className="flex flex-col items-center justify-center">
                    <div className="flex items-center gap-2 mb-0.5">
                        <span className={`px-2 py-0.5 text-[10px] font-bold rounded shadow-lg animate-pulse ${isHalf ? "bg-yellow-600 text-black shadow-yellow-900/50" : "bg-red-600 text-white shadow-red-900/50"}`}>
                            {isHalf ? "HALF" : "LIVE"}
                        </span>
                        {!isHalf && <span className="text-xs text-white font-black tracking-tight">{getQuarterDisplay(quarter)}</span>}
                    </div>
                    {isHalf ? <span className="text-[10px] text-yellow-400 font-mono font-bold tracking-widest drop-shadow-[0_0_5px_rgba(234,179,8,0.8)]">INTERMISSION</span> : <span className="text-sm text-white font-mono font-bold tracking-widest leading-none">{clock}</span>}
                </div>
            );
        };

        const W1ParticleExplosion = ({ color }) => {
            const particles = Array.from({ length: 30 });
            return (
                <div className="absolute top-0 left-0 w-full h-full pointer-events-none z-0">
                    {particles.map((_, i) => {
                        const angle = Math.random() * 360;
                        const distance = Math.random() * 40 + 20;
                        const tx = Math.cos(angle * Math.PI / 180) * distance + 'px';
                        const ty = Math.sin(angle * Math.PI / 180) * distance + 'px';
                        const r = Math.random() * 360 + 'deg';
                        const duration = Math.random() * 1 + 0.8 + 's';
                        const delay = Math.random() * 0.5 + 's';
                        return (
                            <div key={i} className="w1-particle" style={{ '--tx': tx, '--ty': ty, '--r': r, animation: `w1-particleExplosion ${duration} ease-out ${delay} infinite`, backgroundColor: color || '#facc15' }} />
                        );
                    })}
                </div>
            );
        };

        const W1GameCard = ({ game }) => {
            const [homeUpdating, setHomeUpdating] = useState(false);
            const [awayUpdating, setAwayUpdating] = useState(false);
            const [showUpdateOverlay, setShowUpdateOverlay] = useState(false);
            const [scoringTeam, setScoringTeam] = useState(null); 
            const prevHomeScore = useRef(game.homeScore);
            const prevAwayScore = useRef(game.awayScore);
            const homeTimer = useRef(null);
            const awayTimer = useRef(null);
            const overlayTimer = useRef(null);
            const [showHomeSparks, setShowHomeSparks] = useState(false);
            const [showAwaySparks, setShowAwaySparks] = useState(false);

            useEffect(() => {
                if (game.homeScore !== prevHomeScore.current) {
                    prevHomeScore.current = game.homeScore;
                    if (game.homeScore > 0) {
                        setScoringTeam('home');
                        setHomeUpdating(true); setShowHomeSparks(true); setShowUpdateOverlay(true);
                        if (homeTimer.current) clearTimeout(homeTimer.current);
                        homeTimer.current = setTimeout(() => { setHomeUpdating(false); setShowHomeSparks(false); }, 20000);
                        if (overlayTimer.current) clearTimeout(overlayTimer.current);
                        overlayTimer.current = setTimeout(() => { setShowUpdateOverlay(false); }, 3000);
                    } else { setHomeUpdating(false); setShowHomeSparks(false); }
                }
            }, [game.homeScore]);

            useEffect(() => {
                if (game.awayScore !== prevAwayScore.current) {
                    prevAwayScore.current = game.awayScore;
                    if (game.awayScore > 0) {
                        setScoringTeam('away');
                        setAwayUpdating(true); setShowAwaySparks(true); setShowUpdateOverlay(true);
                        if (awayTimer.current) clearTimeout(awayTimer.current);
                        awayTimer.current = setTimeout(() => { setAwayUpdating(false); setShowAwaySparks(false); }, 20000);
                        if (overlayTimer.current) clearTimeout(overlayTimer.current);
                        overlayTimer.current = setTimeout(() => { setShowUpdateOverlay(false); }, 3000);
                    } else { setAwayUpdating(false); setShowAwaySparks(false); }
                }
            }, [game.awayScore]);

            const isPregame = game.status === 'PREGAME';
            const homeBg = game.color1 || 'transparent';
            const homeAccent = game.color2 || '#facc15'; 
            const awayBg = game.awayc1 || 'transparent'; 
            const awayAccent = game.awayc2 || '#facc15'; 

            const containerClasses = isPregame ? `w1-pregame-card transition-all duration-300 group` : `w1-live-card transition-all duration-300 group`;
            const formattedWeek = game.week ? `WEEK ${game.week.toString().replace(/^Week\s*/i, '')}` : 'WEEK ?';
            
            let overlayStyle = { backgroundColor: '#facc15', color: '#171717', borderColor: '#ffffff' };
            if (scoringTeam === 'home') overlayStyle = { backgroundColor: game.color1 || '#171717', color: game.color2 || '#facc15', borderColor: game.color2 || '#facc15' };
            else if (scoringTeam === 'away') overlayStyle = { backgroundColor: game.awayc1 || '#171717', color: game.awayc2 || '#facc15', borderColor: game.awayc2 || '#facc15' };

            const isHomePossession = !isPregame && game.possession === 'home';
            const isAwayPossession = !isPregame && game.possession === 'away';
            const homeOpacity = isAwayPossession ? 0.5 : 1;
            const awayOpacity = isHomePossession ? 0.5 : 1;

            const homeSectionStyle = homeUpdating ? 
                { opacity: 1, padding: '0.75rem', margin: '0 -0.5rem', borderRadius: '0.5rem', '--team-bg': homeBg, '--team-accent': homeAccent, '--team-accent-dim': `${homeAccent}66`, '--pulse-color': homeAccent, transition: 'all 1.5s ease-out' } : 
                { padding: '0.75rem', margin: '0 -0.5rem', borderRadius: '0.5rem', '--team-bg': homeBg, '--team-accent': homeAccent, '--team-accent-dim': `${homeAccent}66`, '--pulse-color': homeAccent, transition: 'all 1.5s ease-out', backgroundColor: homeBg, opacity: homeOpacity, border: isHomePossession ? `2px solid ${homeAccent}` : `2px solid transparent`, boxShadow: isHomePossession ? `0 0 25px ${homeAccent}66, inset 0 0 20px rgba(0,0,0,0.5)` : 'inset 0 0 20px rgba(0,0,0,0.5)' };

            const awaySectionStyle = awayUpdating ? 
                { opacity: 1, padding: '0.75rem', margin: '0 -0.5rem', borderRadius: '0.5rem', '--team-bg': awayBg, '--team-accent': awayAccent, '--team-accent-dim': `${awayAccent}66`, '--pulse-color': awayAccent, transition: 'all 1.5s ease-out' } : 
                { padding: '0.75rem', margin: '0 -0.5rem', borderRadius: '0.5rem', '--team-bg': awayBg, '--team-accent': awayAccent, '--team-accent-dim': `${awayAccent}66`, '--pulse-color': awayAccent, transition: 'all 1.5s ease-out', backgroundColor: awayBg, opacity: awayOpacity, border: isAwayPossession ? `2px solid ${awayAccent}` : `2px solid transparent`, boxShadow: isAwayPossession ? `0 0 25px ${awayAccent}66, inset 0 0 20px rgba(0,0,0,0.5)` : 'inset 0 0 20px rgba(0,0,0,0.5)' };

            return (
                <div className={containerClasses}>
                    {showUpdateOverlay && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm rounded-xl w1-animate-overlay-sequence">
                            <div className="text-2xl font-black italic tracking-tighter px-6 py-4 rounded-lg shadow-lg border-4 transform" style={overlayStyle}>SCORE UPDATE!</div>
                        </div>
                    )}
                    <div className="bg-black/40 px-4 py-3 flex justify-between items-center border-b border-neutral-800 relative z-10 rounded-t-xl gap-2">
                        <div className="bg-yellow-500 text-black text-[10px] font-black uppercase px-2 py-1 rounded-sm shadow-sm tracking-tighter shrink-0">{formattedWeek}</div>
                        {!isPregame && (
                            <div className="flex items-center space-x-3 px-2 border-x border-white/5 bg-white/5 rounded py-1">
                                <div className="text-center flex flex-col"><span className="text-[9px] text-neutral-500 font-black uppercase tracking-widest leading-none mb-1">DOWN</span><span className="text-white font-mono font-bold text-sm leading-none">{game.down || "-"}</span></div>
                                <div className="text-center flex flex-col"><span className="text-[9px] text-neutral-500 font-black uppercase tracking-widest leading-none mb-1">TO GO</span><span className="text-white font-mono font-bold text-sm leading-none">{game.togo || "-"}</span></div>
                                <div className="text-center flex flex-col"><span className="text-[9px] text-neutral-500 font-black uppercase tracking-widest leading-none mb-1">BALL</span>
                                    <span className="text-white font-mono font-bold text-sm leading-none">{game.ownOpp ? `${game.ownOpp} ${game.ballOn}` : (game.ballOn || "-")}</span>
                                </div>
                            </div>
                        )}
                        <div className="shrink-0"><W1StatusBadge status={game.status} clock={game.clock} quarter={game.quarter} /></div>
                    </div>
                    <div className="p-6 flex flex-col justify-center min-h-[20rem] relative z-10">
                        {game.ticker && (
                            <div className="mb-4 overflow-hidden relative bg-yellow-900/20 border border-yellow-400/80 rounded px-2 py-1.5 flex items-center shadow-inner">
                                <div className="shrink-0 mr-3 text-yellow-300 flex items-center justify-center border-r border-yellow-400/50 pr-2"><SharedIcon name="megaphone" className="w-4 h-4" /></div>
                                <div className="overflow-hidden w-full relative h-5"><div className="w1-animate-marquee absolute top-0 left-0 h-full flex items-center text-xs font-mono font-bold text-yellow-200 uppercase tracking-widest">{game.ticker}</div></div>
                            </div>
                        )}
                        <div className={`flex items-center justify-between mb-5 relative transition-all duration-300 ease-in-out ${homeUpdating ? 'w1-scoring-active' : ''}`} style={homeSectionStyle}>
                            <div className="flex items-center space-x-4 flex-1 relative">
                                {showHomeSparks && <W1ParticleExplosion color={homeAccent} />}
                                <W1TeamLogo name={game.home} logoUrl={game.homeLogo} colorClass="bg-neutral-800 text-yellow-500 border-neutral-700" />
                                <div className="flex flex-col items-start">
                                    <div className={`flex flex-wrap items-baseline gap-2 transition-all duration-300`}>
                                        <span className={`text-xl font-bold leading-none tracking-tight uppercase text-white ${homeUpdating ? 'w1-score-pulse' : ''}`}>{game.home}</span>
                                        {game.homeRecord && <span className="text-xs text-white font-mono font-bold tracking-tight">({game.homeRecord})</span>}
                                        {!isPregame && game.possession === 'home' && <div title="Possession" className="w1-flip-in"><W1FootballIcon className="w-5 h-5 animate-pulse drop-shadow-md" /></div>}
                                    </div>
                                    <span className="text-[9px] text-white font-bold uppercase tracking-widest mt-1">HOME {game.homeClass && <span className="ml-1 font-black" style={{ color: homeAccent }}>• {game.homeClass}</span>}</span>
                                </div>
                            </div>
                            <span className={`text-4xl font-mono font-bold tracking-tighter text-white ${homeUpdating ? 'w1-score-pulse' : ''}`}>{game.homeScore}</span>
                        </div>
                        <div className="relative h-px bg-neutral-800 w-full my-2"><div className="absolute left-1/2 -top-2.5 -translate-x-1/2 bg-neutral-900 px-2 text-[10px] text-neutral-600 font-black uppercase tracking-widest">VS</div></div>
                        <div className={`flex items-center justify-between mt-5 relative transition-all duration-300 ease-in-out ${awayUpdating ? 'w1-scoring-active' : ''}`} style={awaySectionStyle}>
                            <div className="flex items-center space-x-4 flex-1 relative">
                                {showAwaySparks && <W1ParticleExplosion color={awayAccent} />}
                                <W1TeamLogo name={game.away} logoUrl={game.awayLogo} colorClass="bg-neutral-800 text-yellow-500 border-neutral-700" />
                                <div className="flex flex-col items-start">
                                    <div className={`flex flex-wrap items-baseline gap-2 transition-all duration-300`}>
                                        <span className={`text-xl font-bold leading-none tracking-tight uppercase text-white ${awayUpdating ? 'w1-score-pulse' : ''}`}>{game.away}</span>
                                        {game.awayRecord && <span className="text-xs text-white font-mono font-bold tracking-tight">({game.awayRecord})</span>}
                                        {!isPregame && game.possession === 'away' && <div title="Possession" className="w1-flip-in"><W1FootballIcon className="w-5 h-5 animate-pulse drop-shadow-md" /></div>}
                                    </div>
                                    <span className="text-[9px] text-white font-bold uppercase tracking-widest mt-1">AWAY {game.awayClass && <span className="ml-1 font-black" style={{ color: awayAccent }}>• {game.awayClass}</span>}</span>
                                </div>
                            </div>
                            <span className={`text-4xl font-mono font-bold tracking-tighter text-white ${awayUpdating ? 'w1-score-pulse' : ''}`}>{game.awayScore}</span>
                        </div>
                        <W1LiveDrive game={game} />
                    </div>
                </div>
            );
        };

        const PAHSCard = ({ game }) => {
            return (
                <div className="h-full w-full relative overflow-hidden font-sans p-[1vmin] bg-black flex items-center justify-center">
                    <div className="w-full max-w-4xl transform scale-90 md:scale-100">
                        <W1GameCard game={game} />
                    </div>
                </div>
            );
        }
        // =========================================================================
        // PAHS LIVE GAME WIDGET (Single Live View with Drive Tracker)
        // =========================================================================

        const W1ParticleExplosion = ({ color }) => {
            const particles = Array.from({ length: 30 });
            return (
                <div className="absolute top-0 left-0 w-full h-full pointer-events-none z-0">
                    {particles.map((_, i) => {
                        const angle = Math.random() * 360;
                        const distance = Math.random() * 40 + 20;
                        const r = Math.random() * 360 + 'deg';
                        return (
                            <div key={i} className="w1-particle" style={{ 
                                '--tx': Math.cos(angle * Math.PI / 180) * distance + 'px', 
                                '--ty': Math.sin(angle * Math.PI / 180) * distance + 'px', 
                                '--r': r, 
                                animation: `particleExplosion ${Math.random() * 1 + 0.8}s ease-out ${Math.random() * 0.5}s infinite`,
                                backgroundColor: color || '#facc15'
                            }} />
                        );
                    })}
                </div>
            );
        };

        const W1LiveDrive = ({ game }) => {
            if (!game.ballOn || game.status === 'FINAL' || game.status === 'UPCOMING') return null;
            const yardInt = parseInt(game.ballOn) || 0;
            const isOpp = (game.ownOpp || "").toUpperCase() === "OPP";
            let percentage = yardInt === 50 ? 50 : (isOpp ? 100 - yardInt : yardInt);
            percentage = Math.max(0, Math.min(100, percentage));
            const isHomePossession = game.possession === 'home';
            const teamColor = isHomePossession ? (game.color2 || '#facc15') : (game.awayc2 || '#facc15');
            const yardMarkers = [10, 20, 30, 40, 50, 40, 30, 20, 10];

            return (
                <div className="mt-[2vmin] mb-[1vmin] w-full max-w-[90vmin]">
                    <div className="text-gray-500 text-[1.5vmin] font-bold mb-[0.5vmin] tracking-widest uppercase">Live Drive Tracker</div>
                    <div className="relative w-full h-[10vmin] w1-drive-field rounded-xl border border-white/20 shadow-inner overflow-hidden flex">
                        {/* Home Endzone */}
                        <div className="relative h-full w-[10%] border-r border-white/30 flex items-center justify-center shrink-0 z-10" style={{ backgroundColor: '#000' }}>
                            <img src={game.homeLogo} className="w-[5vmin] h-[5vmin] object-contain" onError={(e) => e.target.style.display='none'} />
                        </div>
                        {/* Field */}
                        <div className="relative h-full flex-1">
                            {yardMarkers.map((yard, i) => (
                                <div key={i} className="absolute top-0 bottom-0 w-px flex flex-col items-center justify-center z-0" style={{ left: `${(i + 1) * 10}%`, transform: 'translateX(-50%)' }}>
                                    <div className="absolute top-0 bottom-0 w-px bg-white/20"></div>
                                    <span className="relative text-[1.2vmin] font-mono font-bold text-white/50 z-10">{yard}</span>
                                </div>
                            ))}
                            {/* Drive Bar */}
                            <div className="absolute top-0 bottom-0 z-10 transition-all duration-700 ease-out flex items-center"
                                 style={{ left: isHomePossession ? '0' : 'auto', right: isHomePossession ? 'auto' : '0', width: `${percentage}%`, background: `linear-gradient(${isHomePossession ? '90deg' : '-90deg'}, ${teamColor}88, ${teamColor})` }}>
                                <div className={`absolute top-1/2 -translate-y-1/2 flex items-center ${isHomePossession ? 'flex-row' : 'flex-row-reverse'}`} style={{ [isHomePossession ? 'right' : 'left']: '-2vmin' }}>
                                    <Football className="w-[4vmin] h-[4vmin] drop-shadow-md relative z-10 text-white" />
                                </div>
                            </div>
                        </div>
                        {/* Away Endzone */}
                        <div className="relative h-full w-[10%] border-l border-white/30 flex items-center justify-center shrink-0 z-10" style={{ backgroundColor: '#000' }}>
                            <img src={game.awayLogo} className="w-[5vmin] h-[5vmin] object-contain" onError={(e) => e.target.style.display='none'} />
                        </div>
                    </div>
                </div>
            );
        };

        const PAHSLiveCard = ({ game }) => {
            const homeAccent = game.color2 || '#facc15';
            const awayAccent = game.awayc2 || '#facc15';
            
            // Replicating the exact "black card with yellow/colored outline" style from your request
            const TeamRow = ({ name, score, logo, record, classInfo, accent, isPossession }) => (
                <div className={`flex items-center justify-between p-[2vmin] rounded-xl mb-[1vmin] border-[0.3vmin] relative bg-black`} style={{ borderColor: accent, boxShadow: `0 0 15px ${accent}44` }}>
                    <div className="flex items-center gap-[2vmin]">
                        <img src={logo} className="w-[8vmin] h-[8vmin] object-contain" onError={(e) => e.target.style.display='none'} />
                        <div>
                            <h2 className="text-[4vmin] font-black uppercase text-white leading-none">{name}</h2>
                            <div className="flex gap-[1vmin] text-[2vmin] font-bold text-gray-400 mt-[0.5vmin]">
                                <span>({record})</span>
                                <span style={{color: accent}}>{classInfo}</span>
                            </div>
                        </div>
                        {isPossession && <Football className="w-[3vmin] h-[3vmin] text-white animate-pulse ml-[1vmin]" />}
                    </div>
                    <div className="text-[8vmin] font-mono font-bold leading-none text-white">{score}</div>
                </div>
            );

            return (
                <div className="h-full w-full flex flex-col items-center justify-center p-[2vmin] relative bg-[#050505] font-sans">
                    {/* Header */}
                    <div className="w-full max-w-[90vmin] flex justify-between items-center mb-[2vmin] bg-[#1a1a1a] p-[1.5vmin] rounded-lg border border-white/10">
                        <div className="bg-yellow-500 text-black text-[2vmin] font-black px-[1vmin] rounded">WEEK {game.week}</div>
                        <div className="flex gap-[3vmin] text-[2vmin] font-mono text-white font-bold">
                            <div>DOWN <span className="text-white">{game.down}</span></div>
                            <div>TO GO <span className="text-white">{game.togo}</span></div>
                            <div>BALL <span className="text-white">{game.ownOpp} {game.ballOn}</span></div>
                        </div>
                        <div className="text-right">
                            <div className="bg-red-600 text-white text-[1.5vmin] font-bold px-[1vmin] rounded inline-block mb-[0.5vmin]">{game.status}</div>
                            <div className="text-[2.5vmin] font-black leading-none">{game.clock} {game.quarter !== 1 && `Q${game.quarter}`}</div>
                        </div>
                    </div>

                    {/* Ticker */}
                    {game.ticker && <div className="w-full max-w-[90vmin] mb-[2vmin] overflow-hidden bg-yellow-900/20 border border-yellow-500/30 rounded py-[0.5vmin] px-[1vmin] flex items-center">
                        <Megaphone className="w-[2vmin] h-[2vmin] text-yellow-500 mr-[1vmin]" />
                        <div className="w1-animate-marquee text-[1.8vmin] font-bold text-yellow-400 uppercase">{game.ticker}</div>
                    </div>}
                    
                    {/* Teams */}
                    <div className="w-full max-w-[90vmin]">
                        <TeamRow name={game.home} score={game.homeScore} logo={game.homeLogo} record={game.homeRecord} classInfo={game.homeClass} accent={homeAccent} isPossession={game.possession === 'home'} />
                        <TeamRow name={game.away} score={game.awayScore} logo={game.awayLogo} record={game.awayRecord} classInfo={game.awayClass} accent={awayAccent} isPossession={game.possession === 'away'} />
                    </div>

                    {/* Drive Tracker */}
                    <W1LiveDrive game={game} />
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            // STATE
            const [nflTeamsSelected, setNflTeamsSelected] = usePersistedState('nflTeams', []);
            const [nhlTeamsSelected, setNhlTeamsSelected] = usePersistedState('nhlTeams', []);
            const [mlbTeamsSelected, setMlbTeamsSelected] = usePersistedState('mlbTeams', []);
            const [ncaafTeamsSelected, setNcaafTeamsSelected] = usePersistedState('ncaafTeams', []);
            const [zipConfigs, setZipConfigs] = usePersistedState('zipConfigs', [{ id: '10001', showForecast: false, days: 3 }]);
            const [showPahs, setShowPahs] = usePersistedState('showPahs', true); // THE TOGGLE
            const [clockColor, setClockColor] = usePersistedState('clockColor', 'text-white');
            
            const [weatherDataMap, setWeatherDataMap] = useState({});
            const [scaGames, setScaGames] = useState([]);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);

            // Fetch PAHS Data
            useEffect(() => {
                if (!showPahs) return;
                const db = firebase.database();
                const rootRef = db.ref('games');
                const unsubscribe = rootRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const arr = Array.isArray(data) ? data : Object.values(data);
                        setScaGames(arr.map((entry, idx) => ({
                            id: entry.id || idx,
                            home: entry.home || "Home", away: entry.away || "Away",
                            homeScore: entry.homeScore || 0, awayScore: entry.awayScore || 0,
                            homeLogo: entry.homeLogo, awayLogo: entry.awayLogo,
                            color2: entry.color2 || '#facc15', awayc2: entry.awayc2 || '#facc15',
                            status: (entry.status || "UPCOMING").toUpperCase(),
                            clock: entry.clock || "00:00", quarter: entry.quarter || 1,
                            possession: (entry.possession || "").toLowerCase(),
                            down: entry.down || "-", togo: entry.togo || "-", ballOn: entry.ballOn || "-", ownOpp: entry.ownOpp || "",
                            week: entry.week || "1", homeRecord: entry.homeRecord || "0-0", awayRecord: entry.awayRecord || "0-0",
                            homeClass: entry.homeClass || "", awayClass: entry.awayClass || "", ticker: entry.message || ""
                        })));
                    }
                });
                return () => rootRef.off('value', unsubscribe);
            }, [showPahs]);

            // Fetch Weather
            useEffect(() => {
                zipConfigs.forEach(async (conf) => {
                    try {
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=40.71&longitude=-74.00&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`);
                        const data = await res.json();
                        setWeatherDataMap(prev => ({...prev, [conf.id]: { temp: data.current.temperature_2m, condition: data.current.weather_code, wind: data.current.wind_speed_10m, daily: data.daily, loading: false, city: "NYC" } }));
                    } catch(e) {}
                });
            }, [zipConfigs]);

            const allCards = useMemo(() => {
                const cards = [];
                // 1. Clock
                cards.push({ id: 'clock', component: <ClockCard color={clockColor} /> });
                
                // 2. PAHS Games (If Toggled)
                if (showPahs) {
                    scaGames.forEach(game => cards.push({ id: `pahs-${game.id}`, component: <PAHSLiveCard game={game} /> }));
                }

                // 3. Weather
                zipConfigs.forEach(c => {
                    if (weatherDataMap[c.id]) {
                        cards.push({ id: `w-${c.id}`, component: <WeatherCard weatherData={weatherDataMap[c.id]} /> });
                        if(c.showForecast) cards.push({ id: `f-${c.id}`, component: <ForecastCard weatherData={weatherDataMap[c.id]} days={c.days} /> });
                    }
                });

                // 4. Sports
                nflTeamsSelected.forEach(id => { 
                    const t = NFL_TEAMS.find(x => x.id === id); 
                    if(t) cards.push({ id: `nfl-${id}`, component: <SportsCard team={{...t, logo: `https://a.espncdn.com/i/teamlogos/nfl/500/${id.toLowerCase()}.png`}} /> }); 
                });
                nhlTeamsSelected.forEach(id => { 
                    const t = NHL_TEAMS.find(x => x.id === id); 
                    if(t) cards.push({ id: `nhl-${id}`, component: <SportsCard team={{...t, logo: `https://a.espncdn.com/i/teamlogos/nhl/500/${id.toLowerCase()}.png`}} /> }); 
                });
                
                return cards;
            }, [scaGames, showPahs, zipConfigs, weatherDataMap, nflTeamsSelected, nhlTeamsSelected, clockColor]);

            // Carousel Logic
            useEffect(() => {
                if (allCards.length <= 1 || isSettingsOpen) return;
                const interval = setInterval(() => { setCurrentSlideIndex((prev) => (prev + 1) % allCards.length); }, 6000);
                return () => clearInterval(interval);
            }, [allCards.length, isSettingsOpen]);

            return (
                <div className="w-full h-[100dvh] bg-black text-slate-200 overflow-hidden font-sans">
                    <div className="w-full h-full relative">
                        {allCards.map((card, index) => (
                            <div key={card.id} className={`absolute inset-0 w-full h-full transition-all duration-700 ease-in-out transform ${index === currentSlideIndex ? 'opacity-100 translate-x-0 z-10' : 'opacity-0 translate-x-8 z-0'}`}>
                                {card.component}
                            </div>
                        ))}
                    </div>
                    
                    <button onClick={() => setIsSettingsOpen(true)} className="absolute top-4 right-4 z-50 p-3 bg-black/40 backdrop-blur-md rounded-full hover:bg-white/20 border border-white/10"><Settings className="w-6 h-6 text-white" /></button>

                    {isSettingsOpen && (
                        <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 w-full max-w-2xl rounded-2xl border border-slate-700 shadow-2xl p-6 h-[80vh] flex flex-col">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold text-white">Settings</h2>
                                    <button onClick={() => setIsSettingsOpen(false)}><X size={24} /></button>
                                </div>
                                <div className="overflow-y-auto flex-1 space-y-6">
                                    
                                    {/* PAHS TOGGLE */}
                                    <div className="bg-slate-800/50 rounded-xl p-4 border border-slate-700 flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-white">Show PA HS Football</div>
                                            <div className="text-xs text-gray-400">Enables live game view with drive tracker</div>
                                        </div>
                                        <button onClick={() => setShowPahs(!showPahs)} className={`w-12 h-6 rounded-full relative transition-colors ${showPahs ? 'bg-green-500' : 'bg-slate-600'}`}>
                                            <div className={`absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform ${showPahs ? 'translate-x-6' : 'translate-x-0'}`} />
                                        </button>
                                    </div>

                                    {/* CLOCK COLOR */}
                                    <div className="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
                                        <label className="block text-sm text-slate-400 mb-2">Clock Color</label>
                                        <select value={clockColor} onChange={(e) => setClockColor(e.target.value)} className="w-full bg-slate-950 border border-slate-600 rounded text-white p-2">
                                            <option value="text-white">White</option>
                                            <option value="text-red-500">Red</option>
                                            <option value="text-blue-500">Blue</option>
                                            <option value="text-yellow-400">Yellow</option>
                                        </select>
                                    </div>

                                    {/* OTHER SELECTORS (Simplified for brevity) */}
                                    <div className="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
                                        <h3 className="font-bold text-white mb-2">NFL Teams</h3>
                                        <div className="flex flex-wrap gap-2">
                                            {nflTeamsSelected.map(id => <span key={id} className="bg-blue-600 px-2 rounded flex items-center gap-1 text-sm">{id} <button onClick={()=>setNflTeamsSelected(nflTeamsSelected.filter(x=>x!==id))}><X size={12}/></button></span>)}
                                        </div>
                                        <select onChange={(e) => {if(e.target.value) setNflTeamsSelected([...nflTeamsSelected, e.target.value])}} className="w-full mt-2 bg-slate-950 border border-slate-600 rounded p-2 text-white">
                                            <option value="">Add Team...</option>
                                            {NFL_TEAMS.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                    </div>
                                    
                                </div>
                                <div className="mt-4 flex justify-end">
                                    <button onClick={() => setIsSettingsOpen(false)} className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-6 rounded-xl">Done</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
